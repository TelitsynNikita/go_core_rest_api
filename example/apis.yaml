user:
  get-users:
    type: "postgresql"
    method: post
    call: "get_users"
    body:

  create-user:
    type: postgresql
    method: post
    call: "create_user"
    body:
      email:
        type: string
        tag: 'required,gt=3,lte=50'
      password:
        type: string
        tag: 'required,gt=8,lte=200'

  sign-up:
    type: postgresql
    method: post
    call: "get_users"
    body:
      name:
        type: string
        tag: 'required,gt=0,lte=50'
      surname:
        type: string
        tag: 'required,gt=0,lte=50'
      age:
        type: int64
        tag: 'required,gt=0,lte=150'
      email:
        type: string
        tag: 'required,gt=3,lte=50'
      password:
        type: string
        tag: 'required,gt=8,lte=200'

  test:
    type: custom
    method: post
    call: TestFunction
    is_slice: true
    body:
      email:
        type: string
        tag: 'required,gt=3,lte=50'

api:
  get-all-cs-equipment:
    type: postgresql
    method: get
    call: "equipment.get_all_cs_equipment"
    body:

  add-cs-equipment:
    type: postgresql
    method: post
    call: "equipment.add_cs_equipment"
    body:
      name:
        type: string
        tag: 'required,gt=0,lte=100'
      description:
        type: string
        tag: 'required,gt=0,lte=500'
      type:
        type: string
        tag: 'required,oneof=pistol rifle glove knife shotgun submachine_gun sniper machine_gun container sticker keychain agent equipment'

  update-cs-equipment:
    type: postgresql
    method: post
    call: "equipment.update_cs_equipment"
    body:
      id:
        type: int64
        tag: 'required'
      name:
        type: string
        tag: 'required,gt=0,lte=100'
      description:
        type: string
        tag: 'required,gt=0,lte=500'
      type:
        type: string
        tag: 'required,oneof=pistol rifle glove knife shotgun submachine_gun sniper machine_gun container sticker keychain agent equipment'